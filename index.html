<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة وحش الفيزياء - الحضور الذكي</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b132b; margin: 0; padding: 20px; color: #fff; }
        .container { max-width: 600px; background: #1c2541; margin: 30px auto; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); border-radius: 15px; border: 2px solid #5bc0be; text-align: center; }
        
        /* تصميم الهيدر وصورة المستر محمود بكر */
        .header-section { margin-bottom: 25px; }
        .teacher-img { width: 140px; height: 140px; border-radius: 50%; border: 4px solid #5bc0be; object-fit: cover; box-shadow: 0 0 15px rgba(91, 192, 190, 0.5); }
        h2 { color: #5bc0be; margin: 10px 0 5px 0; font-size: 26px; }
        .subtitle { color: #f4d35e; font-weight: bold; margin-bottom: 20px; font-size: 18px; }
        
        .status-box { background: rgba(91, 192, 190, 0.1); border: 2px dashed #5bc0be; padding: 20px; border-radius: 8px; margin: 20px 0; font-size: 18px; color: #5bc0be; font-weight: bold; }
        input[type="text"] { width: 80%; padding: 12px; font-size: 16px; border: 2px solid #5bc0be; background: #0b132b; color: #fff; border-radius: 6px; text-align: center; outline: none; }
        input[type="text"]:focus { border-color: #f4d35e; box-shadow: 0 0 10px rgba(244, 211, 94, 0.5); }
        .log-list { text-align: right; background: #0b132b; padding: 15px; border-radius: 6px; max-height: 200px; overflow-y: auto; border: 1px solid #1c2541; font-size: 14px; }
        .log-item { padding: 5px 0; border-bottom: 1px solid #1c2541; color: #f4d35e; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <!-- تأكد من وضع صورة المستر باسم teacher.png في نفس المجلد -->
        <img src="teacher.png" alt="المستر محمود بكر" class="teacher-img">
        <h2>⚡ منصة وحش الفيزياء ⚡</h2>
        <div class="subtitle">الأستاذ محمود بكر</div>
    </div>
    
    <p>برجاء تمرير بطاقة الطالب ID على جهاز القارئ...</p>
    <input type="text" id="cardInput" placeholder="في انتظار الكارت..." autofocus autocomplete="off">
    
    <div class="status-box" id="statusMessage">
        النظام جاهز لاستقبال الطلاب 🟢
    </div>

    <h3 style="text-align: right; color: #5bc0be;">📋 سجل حضور المجموعات اللحظي:</h3>
    <div class="log-list" id="logList">
        في انتظار تسجيل أول حالة حضور...
    </div>
</div>

<script>
    const cardInput = document.getElementById('cardInput');
    const statusMessage = document.getElementById('statusMessage');
    const logList = document.getElementById('logList');

    document.addEventListener('click', () => cardInput.focus());

    cardInput.addEventListener('keypress', async (e) => {
        if (e.key === 'Enter') {
            const cardId = cardInput.value.trim();
            cardInput.value = '';

            if (!cardId) return;

            statusMessage.innerText = `⏳ جاري التحقق من بيانات الطالب...`;
            statusMessage.style.color = "#f4d35e";

            try {
                const response = await fetch('http://localhost:3000/scan-card', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cardId })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    statusMessage.innerText = `✅ تم الحضور: ${result.studentName}`;
                    statusMessage.style.color = "#5bc0be";
                    
                    if(logList.innerText.includes("في انتظار")) logList.innerHTML = "";
                    logList.innerHTML = `<div class="log-item">• دخل الطالب [${result.studentName}] حصة الفيزياء الآن وتم إبلاغ ولي أمره.</div>` + logList.innerHTML;
                } else {
                    statusMessage.innerText = `❌ ${result.message}`;
                    statusMessage.style.color = "#e63946";
                }
            } catch (error) {
                statusMessage.innerText = '❌ فشل الاتصال بالسيرفر الداخلي.';
                statusMessage.style.color = "#e63946";
            }
        }
    });
</script>

</body>
</html>
